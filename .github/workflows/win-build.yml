# Manually builds the Windows version.dll proxy (x64/x86/arm64) and publishes
# version.dll-v<ver>.zip (x64/, x86/, arm64/ folders inside) to a release
# tagged v<ver>. <ver> is the DLL's ProductVersion, whose single source of
# truth is build.bat's MV2_VER. chrome-mv2.ps1 finds the asset by following the
# releases/latest redirect to the tag (api.github.com is avoided - it
# rate-limits by IP).
# (GitHub also auto-attaches "Source code" links to every release - the whole
# repo, minus gitignored detours/ and build/ - which cannot be scoped or
# disabled.)
#
# Manual runs only: Actions tab -> "Build Windows version.dll" -> Run workflow.
# The file must exist on the default branch for the button to appear.
#
# Requires mv2-mem-patch-win/version.rc to be committed (build.bat compiles it).
name: Build Windows version.dll

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships VS 2022 with the C++ workload; build.bat finds it
      # via vswhere and calls vcvarsall itself. arm64 is skipped cleanly if the
      # ARM64 cross tools are not on the image.
      - name: Build version.dll (x64/x86/arm64)
        shell: cmd
        run: |
          call mv2-mem-patch-win\build.bat all
          if not exist mv2-mem-patch-win\build\x64\version.dll (
            if not exist mv2-mem-patch-win\build\x86\version.dll (
              echo No version.dll was built. & exit /b 1
            )
          )

      # Zip the arch dirs with bsdtar (Compress-Archive writes backslash entry
      # separators, which non-Windows unzip tools mishandle). An arch whose
      # toolchain is missing is skipped with a warning, but x64 must be present.
      - name: Package version.dll-v<ver>.zip
        id: package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'zip-root'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $built = @()
          foreach ($a in 'x64', 'x86', 'arm64') {
            $src = "mv2-mem-patch-win/build/$a/version.dll"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path (Join-Path $root $a) | Out-Null
              Copy-Item $src (Join-Path $root $a) -Force
              $built += $a
            } else {
              Write-Host "::warning::no version.dll for $a (toolchain missing?)"
            }
          }
          if ($built -notcontains 'x64') { throw 'no x64 version.dll - refusing to release' }
          $ver = (Get-Item (Join-Path $root 'x64/version.dll')).VersionInfo.ProductVersion
          if (-not $ver) { throw "couldn't read ProductVersion from the x64 version.dll" }
          $zip = "version.dll-v$ver.zip"
          Write-Host "packaging $zip ($($built -join ', '))"
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          tar -a -cf (Join-Path $outDir $zip) -C $root @built
          "version=v$ver" >> $env:GITHUB_OUTPUT

      # No release name or body: the release is just the version-stamped zips
      # on a v<ver> tag. (GitHub auto-attaches "Source code" links to every
      # release; those cannot be disabled.)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.version }}
          files: release-assets/*
          fail_on_unmatched_files: true
