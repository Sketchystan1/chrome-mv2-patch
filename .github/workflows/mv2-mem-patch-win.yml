# Builds the Windows version.dll proxy (x64/x86/arm64) and publishes it to a
# GitHub Release, which is where chrome-mv2.ps1 downloads it from
# (releases/latest/download/version-<arch>.dll).
#
#   - Push a tag "v*"     -> a normal release for that tag (this is what the
#                            script's /latest/ URL resolves to).
#   - Run it by hand      -> a rolling "win-latest" PRE-release for testing
#                            (pre-releases are NOT served by /latest/).
#
# Requires mv2-mem-patch-win/version.rc to be committed (build.bat compiles it).
name: Build Windows version.dll

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships VS 2022 with the C++ workload; build.bat finds it
      # via vswhere and calls vcvarsall itself. arm64 is skipped cleanly if the
      # ARM64 cross tools are not on the image.
      - name: Build version.dll (x64/x86/arm64)
        shell: cmd
        run: |
          call mv2-mem-patch-win\build.bat all
          if not exist mv2-mem-patch-win\build\x64\version.dll (
            if not exist mv2-mem-patch-win\build\x86\version.dll (
              echo No version.dll was built. & exit /b 1
            )
          )

      - name: Stage release assets
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($a in 'x64', 'x86', 'arm64') {
            $src = "mv2-mem-patch-win/build/$a/version.dll"
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $stage "version-$a.dll") -Force
              Write-Host "staged version-$a.dll"
            } else {
              Write-Host "::warning::no version.dll for $a (toolchain missing?)"
            }
          }
          # Include the version-stamped per-arch zips for humans, if present.
          Get-ChildItem 'mv2-mem-patch-win/build' -Filter '*.zip' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $stage -Force }
          if (-not (Get-ChildItem $stage -Filter '*.dll')) { throw 'nothing to release' }

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Publish rolling pre-release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Windows version.dll (rolling)
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
