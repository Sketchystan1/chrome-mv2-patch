name: Test Windows ARM64 browsers

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to test (all channels)
        type: choice
        default: all
        options: [all, edge, chrome]
      channel:
        description: Channel to test (all channels by default)
        type: choice
        default: all
        options: [all, stable, beta, canary]
      source_run:
        description: Replay vendor installer metadata from this completed test run (empty uses current channels)
        type: string
        default: ''
  push:
    branches: [master]
    paths:
      - 'mv2-mem-patch-win/**'
      - '!mv2-mem-patch-win/**/*.md'
      - '!mv2-mem-patch-win/*_test.cpp'
      - '!mv2-mem-patch-win/install.bat'
      - '!mv2-mem-patch-win/build.bat'
      - 'scripts/fetch_arm64_browser.py'
      - 'scripts/fetch_chrome_binary.py'
      - 'scripts/test_autoscan_runtime.py'
      - 'scripts/test_autoscan_runtime_memory.py'
      - 'scripts/test_autoscan_crx.py'
      - 'scripts/test_fetch_arm64_browser.py'
      - 'scripts/test_autoscan_edge_install.py'
      - 'scripts/autoscan_crx_cdp.mjs'
      - '.github/workflows/win-arm64-test.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: win-arm64-${{ github.ref }}-${{ inputs.browser || 'all' }}-${{ inputs.channel || 'stable' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Check portable fixtures
        run: |
          python scripts/run_tests.py --only image fetch crx-cdp runner
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_autoscan_runtime_memory.py
      - name: Build ARM64 patcher and test helpers
        working-directory: mv2-mem-patch-win
        run: |
          cmake --preset arm64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/arm64 --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset arm64 --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-test-binaries
          if-no-files-found: error
          path: |
            mv2-mem-patch-win/build/arm64/secur32.dll
            mv2-mem-patch-win/out/arm64/mv2-scan.exe
            mv2-mem-patch-win/out/arm64/test-launch.exe
            mv2-mem-patch-win/out/arm64/registry-test.dll
            mv2-mem-patch-win/out/arm64/browser-ui.exe

  browser:
    name: ${{ matrix.browser }} ${{ matrix.channel }} ARM64
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'edge' && '["edge"]' || inputs.browser == 'chrome' && '["chrome"]' || '["chrome","edge"]') }}
        channel: ${{ fromJSON(inputs.channel == 'stable' && '["stable"]' || inputs.channel == 'beta' && '["beta"]' || inputs.channel == 'canary' && '["canary"]' || github.event_name == 'push' && '["stable"]' || '["stable","beta","canary"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: actions/download-artifact@v4
        with:
          name: arm64-test-binaries
          path: mv2-mem-patch-win
      - name: Fetch stock ARM64 browser
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          BROWSER: ${{ matrix.browser }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          $sourceArgs = @()
          if ($env:SOURCE_RUN) {
            gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name "$env:BROWSER-$env:CHANNEL-arm64-results" --dir _scratch/source
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $sourceArgs = @('--source', '_scratch/source/browser/source.json')
          }
          python scripts/fetch_arm64_browser.py --browser $env:BROWSER --channel $env:CHANNEL --out _scratch/browser @sourceArgs
      - name: Direct Edge app-tree diagnostic with a fresh profile
        id: install_context
        if: matrix.browser == 'edge' && (matrix.channel == 'beta' || matrix.channel == 'canary')
        continue-on-error: true
        run: python scripts/test_autoscan_edge_install.py _scratch/browser/matrix.json --arch arm64 --work _scratch/install
      - name: Check signed CRX lifecycle
        id: crx
        if: always() && steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/test_autoscan_crx.py _scratch/browser/matrix.json --arch arm64 --work _scratch/crx
      - name: Enforce browser test results
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
          CHANNEL: ${{ matrix.channel }}
          INSTALL_CONTEXT: ${{ steps.install_context.outcome }}
          CRX: ${{ steps.crx.outcome }}
        run: |
          $failed = $env:CRX -ne 'success'
          if ($env:BROWSER -eq 'edge' -and $env:CHANNEL -in @('beta', 'canary') -and $env:INSTALL_CONTEXT -ne 'success') { $failed = $true }
          if ($failed) { exit 1 }
      - name: Record browser identity and result
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
          CHANNEL: ${{ matrix.channel }}
          RESULT: ${{ job.status }}
          INSTALL_CONTEXT: ${{ steps.install_context.outcome }}
        run: |
          "### $env:BROWSER $env:CHANNEL ARM64: $env:RESULT" >> $env:GITHUB_STEP_SUMMARY
          if ($env:BROWSER -eq 'edge' -and $env:CHANNEL -in @('beta', 'canary')) { "Direct app-tree diagnostic (fresh profile): $env:INSTALL_CONTEXT" >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path -LiteralPath '_scratch/browser/source.json') {
            $source = Get-Content -LiteralPath '_scratch/browser/source.json' -Raw | ConvertFrom-Json
            "Version: $($source.version)" >> $env:GITHUB_STEP_SUMMARY
            "Installer SHA-256: $($source.sha256)" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path -LiteralPath '_scratch/crx/scan.json') {
            $report = Get-Content -LiteralPath '_scratch/crx/scan.json' -Raw | ConvertFrom-Json
            "Browser DLL SHA-256: $($report.sha256)" >> $env:GITHUB_STEP_SUMMARY
            "Discovery ready: $($report.ready); error: $($report.error)" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path -LiteralPath '_scratch/install/results.json') {
            $diagnostic = Get-Content -LiteralPath '_scratch/install/results.json' -Raw | ConvertFrom-Json
            "Direct app-tree result: $($diagnostic.direct_dll_only); $($diagnostic.error)" >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser }}-${{ matrix.channel }}-arm64-results
          path: |
            _scratch/browser/source.json
            _scratch/browser/matrix.json
            _scratch/install/*.json
            _scratch/install/*.log
            _scratch/crx/*.json
            _scratch/crx/*.log
            _scratch/crx/*.stderr
            _scratch/crx/*.txt
